<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libreria Las Trillizas - Libreria</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    <!-- Encabezado con logo oficial -->
    <div class="bg-gradient-to-r from-indigo-800 via-blue-700 to-indigo-900 p-8 text-white text-center">
      <div class="inline-block p-1 bg-white rounded-2xl shadow-lg mb-3">
        <img src="img/logo.jpg" alt="Logo Libreria Las Trillizas" class="w-24 h-24 rounded-xl object-contain">
      </div>
      <h1 class="text-2xl font-bold tracking-tight">Libreria Las Trillizas</h1>
      <p class="text-blue-200 text-xs font-medium uppercase tracking-wider mt-1">Librería - Punto de Venta e Inventario</p>
    </div>

    <!-- Formulario de Login -->
    <div class="p-8">
      <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded"></div>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1">Usuario</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
              </svg>
            </span>
            <input type="text" id="username" required autocomplete="username"
              class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 transition"
              placeholder="Ingrese su usuario">
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
              </svg>
            </span>
            <input type="password" id="password" required autocomplete="current-password"
              class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-800 transition"
              placeholder="••••••••">
          </div>
        </div>

        <button type="submit" id="btn-submit"
          class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center space-x-2">
          <span>Ingresar al Sistema</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </form>

      <!-- Accesos Rápidos de Demostración -->
      <div class="mt-8 pt-6 border-t border-slate-200">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider text-center mb-3">Acceso rápido para prueba local</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="fillCredentials('admin', 'admin123')"
            class="text-xs py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-medium text-center border border-slate-300 transition">
            👑 Probar Admin
          </button>
          <button type="button" onclick="fillCredentials('cajero', 'cajero123')"
            class="text-xs py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md font-medium text-center border border-slate-300 transition">
            💼 Probar Empleado
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Si ya tiene sesión activa, redirigir según su rol
    const currentUser = Auth.getUser();
    if (currentUser && Auth.getToken()) {
      if (currentUser.rol === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'pos.html';
      }
    }

    function fillCredentials(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      const submitBtn = document.getElementById('btn-submit');

      errorDiv.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Verificando...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Credenciales incorrectas');
        }

        // Guardar sesión
        Auth.setSession(data.token, data.user);

        // Redireccionar según el rol
        if (data.user.rol === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'pos.html';
        }
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Ingresar al Sistema</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>`;
      }
    });
  </script>
</body>
</html>
